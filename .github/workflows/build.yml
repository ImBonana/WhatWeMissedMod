name: build
on: [workflow_dispatch]

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
        with:
          sparse-checkout: gradle.properties
          sparse-checkout-cone-mode: false

      - name: read mod version
        id: version
        run: echo "version=$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

  build:
    name: build ${{ needs.version.outputs.version }}
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'microsoft'

      - name: setup gradle
        uses: gradle/actions/setup-gradle@v4

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: build
        run: ./gradlew build

      - name: find jars
        id: jars
        run: |
          echo "fabric=$(ls fabric/build/libs/*.jar | grep -v -- '-raw.jar' | head -n1)" >> "$GITHUB_OUTPUT"
          echo "neoforge=$(ls neoforge/build/libs/*.jar | grep -v -- '-raw.jar' | head -n1)" >> "$GITHUB_OUTPUT"

      - name: capture fabric jar
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.jars.outputs.fabric }}
          archive: false

      - name: capture neoforge jar
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.jars.outputs.neoforge }}
          archive: false